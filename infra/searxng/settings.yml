use_default_settings: true

general:
  instance_name: "Flux AI SearXNG"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "flux-searxng-dev-secret-change-in-prod"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  enable_http2: true
