name: ai-service-prod

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_api_prod
    restart: unless-stopped
    mem_limit: ${AI_API_MEM_LIMIT:-1536m}
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: ${PORT:-18420}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ai_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@ai-postgres:5432/${POSTGRES_DB:-ai_db}"
      REDIS_URL: "redis://ai-redis:6379"
      QDRANT_URL: "http://ai-qdrant:6333"
      LIBRARY_BACKEND_URL: "${LIBRARY_BACKEND_URL:-https://api.example.com}"
      EDITOR_BACKEND_URL: "${EDITOR_BACKEND_URL:-${LIBRARY_BACKEND_URL:-https://api.example.com}}"
      PROJECT_BACKEND_URL: "${PROJECT_BACKEND_URL:-${LIBRARY_BACKEND_URL:-https://api.example.com}}"
    ports:
      - "127.0.0.1:${PORT:-18420}:18420"
    depends_on:
      ai-postgres:
        condition: service_healthy
      ai-redis:
        condition: service_healthy
      ai-qdrant:
        condition: service_healthy
    networks:
      - ai_network

  ai-postgres:
    image: postgres:16-alpine
    container_name: ai_postgres_prod
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_user} -d ${POSTGRES_DB:-ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_network

  ai-qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_qdrant_prod
    restart: unless-stopped
    mem_limit: ${QDRANT_MEM_LIMIT:-1024m}
    logging: *default-logging
    volumes:
      - ai_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_network

  ai-redis:
    image: redis:7-alpine
    container_name: ai_redis_prod
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-200mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai_network

volumes:
  ai_postgres_data:
  ai_qdrant_data:
  ai_redis_data:

networks:
  ai_network:
    driver: bridge
