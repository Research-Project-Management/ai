services:
  # ── Flux-AI Server ──────────────────────────────────────────────
  flux-ai:
    build: .
    container_name: flux-ai
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
      - ./app:/app/app # Hot-reload source
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "3000",
        "--reload",
      ]
    restart: unless-stopped
    # Qdrant Cloud + Redis local đã có sẵn, không cần depends_on
